<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QQKOBEを開発している神戸電子専門学校IT学科の開発チームについて紹介します。">
  <title>開発チームについて｜QQKOBE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
      color: #333;
      background: #f7f8f8;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    header {
      background: #286b78;
      color: white;
      padding: 24px 20px;
    }

    .header-inner,
    main,
    footer {
      max-width: 800px;
      margin: 0 auto;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      padding: 32px 20px 48px;
    }

    section {
      margin-bottom: 28px;
    }

    h2 {
      font-size: 19px;
      border-bottom: 1px solid #d8e0e1;
      padding-bottom: 8px;
    }

    p {
      margin: 8px 0 12px;
    }

    .contact-box {
      background: white;
      border: 1px solid #d8e0e1;
      border-radius: 10px;
      padding: 22px;
      margin: 20px 0;
      overflow-wrap: anywhere;
    }

    .email {
      font-size: 17px;
      font-weight: bold;
      margin: 12px 0;
    }

    a {
      color: #245e70;
    }

    .back-link {
      display: inline-block;
      margin-top: 12px;
    }

    footer {
      border-top: 1px solid #e1e5e5;
      padding: 20px;
      text-align: center;
      color: #666;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px 18px;
      }

      main {
        padding: 24px 18px 36px;
      }

      .contact-box {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <h1>開発チームについて</h1>
    </div>
  </header>

  <main>
    <section>
      <p>
        神戸電子専門学校のIT学科4年生6名で開発しています。
      </p>
      <p>
        私達は、神戸市に住む親子が本アプリで防災を楽しく学び、緊急時には迷わず行動できるようになっていることを目指しています。
        また、私達自身も開発を楽しみながら防災について学んでいます。
      </p>
    </section>

    <section>
      <h2>連絡先</h2>
      <div class="contact-box">
        <p class="email">
          <a href="mailto:qqkobe.support@gmail.com">
            qqkobe.support@gmail.com
          </a>
        </p>
      </div>
    </section>

    <a class="back-link" href="./index.html">
      ← トップページに戻る
    </a>
  </main>

  <footer>
    <p>&copy; QQKOBE 開発チーム</p>
  </footer>
</body>
</html>
